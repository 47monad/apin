name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.sum
            initrs/*/go.sum
            canary/go.sum

      - name: Build and test root module
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Build and test initrs
        run: |
          set -e
          for d in initrs/*/; do
            echo "::group::$d"
            (cd "$d" && go build ./... && go vet ./... && go test ./...)
            echo "::endgroup::"
          done

      - name: Build examples
        run: |
          set -e
          for d in examples/*/; do
            (cd "$d" && go build ./... && go vet ./...)
          done
